---
# install/workstation-stage-01.yml
#
# Bring-up stage: packages, users, network. Run this from the live ISO / a fresh
# root shell. Everything here is machine-level and needs no user session.
#
#   ansible-playbook install/workstation-stage-01.yml
#
# Reboot afterwards, log in as the real user, then run stage 02.

- name: Run common setup tasks
  import_playbook: ../playbooks/005-install-basics.yml

- name: Wired network DHCP configuration
  import_playbook: ../playbooks/010-network-wired-dhcp.yml

- name: WIFI network configuration
  import_playbook: ../playbooks/015-network-wifi.yml

- name: Create user
  import_playbook: ../playbooks/020-create-user.yml
