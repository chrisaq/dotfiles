---
# install/workstation-stage-02.yml
#
# Post-reboot stage, run as your normal user (AUR builds must not run as root).
#
#   ansible-playbook install/workstation-stage-02.yml
#
# Order matters: 100 creates wg-home/wg-full, 105 wires up the SSID policy
# that switches between them. 105 before 100 would target interfaces that
# do not exist yet.

- name: Common workstation packages
  import_playbook: ../playbooks/050-workstation-install.yml

- name: AUR for workstation
  import_playbook: ../playbooks/055-user-install-aur.yml

- name: Wireguard tunnels
  import_playbook: ../playbooks/100-wireguard.yml

- name: SSID-based wireguard policy
  import_playbook: ../playbooks/105-wg-policy.yml

- name: Lock/suspend polkit rules
  import_playbook: ../playbooks/150-hypridle_polkit.yml
