[defaults]
# Paths are relative to this file, so the tree works from a checkout, a bare
# repo work-tree, or an unzipped dotfiles.zip without editing anything.
inventory          = inventory/hosts.yml
collections_paths  = collections

# roles_path is intentionally unset: this tree is playbook-based by design.
# Add it back only if roles are ever introduced.

# Don't litter the cwd with *.retry files after a failed run.
retry_files_enabled = False

# Pick the interpreter on the target without a deprecation warning every run.
interpreter_python  = auto_silent

# Quieter, more readable output for a personal setup.
stdout_callback     = default
display_skipped_hosts = False

# Local/remote temp under XDG cache. $XDG_CACHE_HOME is not guaranteed to be set
# in a fresh install environment, so $HOME is used explicitly to avoid the path
# collapsing to "/ansible/.ansible/tmp".
local_tmp = $HOME/.cache/ansible/tmp
remote_tmp = $HOME/.cache/ansible/tmp

[ssh_connection]
# Only relevant if remote playbooks are ever added; harmless otherwise.
pipelining = True
