---
# playbooks/100-wireguard.yml
#
# Sets up the two WireGuard tunnels (wg-home split tunnel, wg-full full tunnel)
# as systemd-networkd netdevs.
#
# KEY HANDLING
#   Private keys are never stored in this repo and are never a prerequisite.
#   If the key file is missing it is generated on the target machine, and the
#   matching PUBLIC key is printed so you can register it on the peer.
#   Re-running this playbook will NOT regenerate or rotate the key.
#
# PERMISSIONS MATTER
#   .network files must be readable by user "systemd-network" (uid 979).
#   A 0640 root:root .network file is silently skipped with
#   "No matching .network found" - which is exactly how wg-full ended up
#   unmanaged on t14s. Everything here is 0644 except the key file.

- hosts: localhost
  become: true
  vars_files:
    - ../vars/network.yml

  tasks:
    - name: Install wireguard-tools
      ansible.builtin.pacman:
        name: wireguard-tools
        state: present

    - name: Ensure key directory exists
      ansible.builtin.file:
        path: "{{ wg_key_file | dirname }}"
        state: directory
        owner: root
        group: systemd-network
        mode: "0750"

    # MIGRATION - must run BEFORE generation.
    # The pre-existing setup kept the key at /etc/systemd/network/wg-priv.key and
    # the peer is registered against THAT key's public half. Without this step the
    # generate task below would create a brand-new key and the following cleanup
    # would delete the old one, silently orphaning the peer registration and
    # breaking both tunnels.
    - name: Check for the legacy key location
      ansible.builtin.stat:
        path: /etc/systemd/network/wg-priv.key
      register: wg_legacy_key

    - name: Migrate legacy key to the managed location
      ansible.builtin.copy:
        src: /etc/systemd/network/wg-priv.key
        dest: "{{ wg_key_file }}"
        owner: root
        group: systemd-network
        mode: "0640"
        remote_src: true
        force: false
      when: wg_legacy_key.stat.exists

    # Generates the key only if absent. changed_when is deliberately false so a
    # no-op run doesn't look like a secret-rotating change.
    - name: Generate WireGuard private key if not present
      ansible.builtin.shell: umask 077; wg genkey > {{ wg_key_file }}
      args:
        creates: "{{ wg_key_file }}"
      changed_when: false
      no_log: true

    - name: Set key file ownership and mode
      ansible.builtin.file:
        path: "{{ wg_key_file }}"
        owner: root
        group: systemd-network
        mode: "0640"

    - name: Read back the private key
      ansible.builtin.slurp:
        src: "{{ wg_key_file }}"
      register: wg_key_slurp
      no_log: true

    - name: Derive the public key for this machine
      ansible.builtin.command: wg pubkey
      args:
        stdin: "{{ wg_key_slurp.content | b64decode }}"
      changed_when: false
      no_log: true
      register: wg_pubkey

    # The ONLY key material ever printed, and it is the public one.
    - name: Show this machine's public key
      ansible.builtin.debug:
        msg: >-
          Register this public key on the WireGuard peer(s):
          {{ wg_pubkey.stdout }}
          (If the peer already knows this key, nothing to do.)

    - name: Build the tunnel list
      ansible.builtin.set_fact:
        wg_tunnels:
          - "{{ wg_home | combine({'file_prefix': '11',
                                  'peers': [{'public_key': wg_home.peer_public_key,
                                             'endpoint': wg_home.endpoint,
                                             'allowed_ips': wg_home.allowed_ips}]}) }}"
          - "{{ wg_full | combine({'file_prefix': '12',
                                  'peers': [{'public_key': wg_full.peer_public_key,
                                             'endpoint': wg_full.endpoint,
                                             'allowed_ips': wg_full.allowed_ips}]}) }}"

    - name: Render WireGuard .netdev files
      ansible.builtin.template:
        src: templates/wg-netdev.j2
        dest: "/etc/systemd/network/{{ t.file_prefix }}-{{ t.link }}.netdev"
        owner: root
        group: systemd-network
        mode: "0640"
      loop: "{{ wg_tunnels }}"
      loop_control:
        loop_var: t
        label: "{{ t.link }}"
      notify: Restart systemd-networkd

    - name: Render WireGuard .network files
      ansible.builtin.template:
        src: templates/wg-network.j2
        dest: "/etc/systemd/network/{{ t.file_prefix }}-{{ t.link }}.network"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ wg_tunnels }}"
      loop_control:
        loop_var: t
        label: "{{ t.link }}"
      notify: Restart systemd-networkd

    # Safe to remove only now: the key has been migrated (or freshly generated)
    # at wg_key_file and is referenced by PrivateKeyFile=.
    - name: Remove legacy key from the network directory
      ansible.builtin.file:
        path: /etc/systemd/network/wg-priv.key
        state: absent
      when: wg_legacy_key.stat.exists

  handlers:
    - name: Restart systemd-networkd
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted
        daemon_reload: true
