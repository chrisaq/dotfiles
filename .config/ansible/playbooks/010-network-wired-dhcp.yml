---
# playbooks/010-network-wired-dhcp.yml

- hosts: localhost
  become: true
  vars_files:
    - ../vars/network.yml

  tasks:
    - name: Render wired DHCP network file
      ansible.builtin.template:
        src: templates/wired.network.j2
        dest: /etc/systemd/network/20-wired.network
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-networkd

    - name: Enable and start systemd-networkd
      ansible.builtin.systemd:
        name: systemd-networkd
        enabled: true
        state: started

    - name: Configure systemd-resolved
      ansible.builtin.include_tasks: tasks/resolved.yml

  handlers:
    - name: Restart systemd-networkd
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted
        daemon_reload: true

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
