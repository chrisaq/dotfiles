---
# playbooks/015-network-wifi.yml
#
# WiFi: iwd for association + systemd-networkd for addressing + resolved for DNS.
#
# The SSID->VPN policy lives in 105-wg-policy.yml, NOT here. It used to be
# installed via ExecUp=/ExecDown= on this .network file, which never worked:
# ExecUp fires when the link comes up, before iwd has associated with any AP,
# so the script read an empty SSID and exited. See 105 for the working design.

- hosts: localhost
  become: true
  vars_files:
    - ../vars/network.yml

  tasks:
    - name: Install WiFi packages
      ansible.builtin.pacman:
        name:
          - iw
          - iwd
        state: present

    - name: Render WiFi network file
      ansible.builtin.template:
        src: templates/wifi.network.j2
        dest: /etc/systemd/network/25-wifi.network
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-networkd

    - name: Configure iwd
      ansible.builtin.copy:
        dest: /etc/iwd/main.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Ansible managed - do not edit by hand.

          [General]
          # iwd must NOT configure addresses/DNS. networkd owns addressing and
          # resolved owns DNS; if iwd also does it we get two writers and DNS
          # that networkd knows nothing about.
          EnableNetworkConfiguration=false

          [Network]
          NameResolvingService=none
      notify: Restart iwd

    - name: Enable and start iwd
      ansible.builtin.systemd:
        name: iwd
        enabled: true
        state: started

  handlers:
    - name: Restart systemd-networkd
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted
        daemon_reload: true

    - name: Restart iwd
      ansible.builtin.systemd:
        name: iwd
        state: restarted
